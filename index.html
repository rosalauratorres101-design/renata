<style>
:root{--bg:#fff8ec;--ink:#2b2d42;--soft:#8d8fa3;--ok:#22a06b;--bad:#e5484d;--card:#fff;--pri:#5b6cff;--sun:#ffb703;--mint:#c8f5e1;--pink:#ffd6e0;--sky:#d6ecff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Arial Rounded MT Bold","Chalkboard SE","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:none;cursor:pointer;touch-action:manipulation}
#app{max-width:900px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:12px 14px 24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px}
.pill{background:#fff;border-radius:999px;padding:8px 14px;font-size:20px;box-shadow:0 2px 0 #0001}
.icon{background:#fff;border-radius:16px;width:52px;height:52px;font-size:26px;box-shadow:0 3px 0 #0002}
.lock{opacity:.55;font-size:20px;width:44px;height:44px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.mascot{font-size:110px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
h1{font-size:30px;margin:0}
h2{font-size:24px;margin:0}
.sub{font-size:19px;color:var(--soft);margin:0}
.big{background:var(--pri);color:#fff;font-size:30px;padding:20px 40px;border-radius:28px;box-shadow:0 6px 0 #3a48c8;min-width:240px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #3a48c8}
.btn{background:#fff;font-size:22px;padding:14px 22px;border-radius:20px;box-shadow:0 4px 0 #0002}
.btn.green{background:var(--ok);color:#fff;box-shadow:0 4px 0 #157a50}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dot{width:16px;height:16px;border-radius:50%;background:#e4e1d8}
.dot.on{background:var(--sun)}.dot.cur{background:var(--pri);transform:scale(1.25)}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;font-size:16px;background:var(--sky)}
.prompt{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.hear{background:var(--sun);width:72px;height:72px;border-radius:50%;font-size:36px;box-shadow:0 5px 0 #c98f00}
.hint{background:#fff3c4;width:56px;height:56px;border-radius:50%;font-size:28px;box-shadow:0 4px 0 #0002}
.visual{font-size:120px;line-height:1.05}
.word{font-size:64px;letter-spacing:2px}
.sentence{font-size:40px}
.opts{display:grid;gap:14px;width:100%;max-width:760px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{background:var(--card);border-radius:26px;min-height:150px;font-size:76px;box-shadow:0 6px 0 #0002;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;line-height:1.05;transition:transform .1s}
.opt.txt{font-size:56px}.opt.small{font-size:34px}
.opt.sel{outline:6px solid var(--pri)}
.opt.ok{background:var(--mint);outline:6px solid var(--ok)}
.opt.no{animation:shake .4s}
.opt.dim{opacity:.35}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.group{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:34px}
.fb{position:fixed;inset:auto 0 0 0;padding:18px;text-align:center;font-size:28px;color:#fff;transform:translateY(110%);transition:transform .25s;z-index:20}
.fb.show{transform:none}.fb.good{background:var(--ok)}.fb.try{background:#f08c00}.fb.look{background:var(--pri)}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{width:74px;height:84px;border-radius:18px;background:#fff;font-size:46px;box-shadow:0 5px 0 #0002}
.slot{width:74px;height:84px;border-radius:18px;border:4px dashed #cfc9bb;font-size:46px;display:flex;align-items:center;justify-content:center;background:#fffdf8}
.slot.fill{border-style:solid;border-color:var(--ok);background:var(--mint)}
canvas.trace{background:#fff;border-radius:24px;box-shadow:0 5px 0 #0002;touch-action:none;width:100%;max-width:700px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.lesson{background:#fff;border-radius:26px;padding:18px;box-shadow:0 5px 0 #0001;width:100%;max-width:760px;text-align:left}
.lesson h3{margin:0 0 8px;font-size:22px}
.lesson p{margin:6px 0;font-size:19px;line-height:1.35}
.cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.wcard{background:var(--sky);border-radius:20px;padding:10px 14px;min-width:120px;text-align:center}
.wcard .e{font-size:54px}.wcard .w{font-size:24px}.wcard .s{font-size:15px;color:var(--soft)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px;width:100%;max-width:760px;font-size:38px;text-align:center}
.confetti{position:fixed;top:-20px;font-size:28px;animation:fall 2.6s linear forwards;z-index:30;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.panel{background:#fff;border-radius:20px;padding:16px;width:100%;max-width:760px;text-align:left;font-family:system-ui,sans-serif;user-select:text;-webkit-user-select:text}
.panel h3{margin:4px 0 10px}.panel p,.panel li{font-size:15px;line-height:1.45}
.bar{height:12px;background:#eee;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
table.sk{width:100%;border-collapse:collapse;font-size:15px}table.sk td{padding:5px 4px;border-bottom:1px solid #eee}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.keypad button{height:64px;font-size:28px;border-radius:16px;background:#fff;box-shadow:0 3px 0 #0002}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:40}
.modal>div{background:#fff;border-radius:20px;padding:20px;max-width:420px;text-align:center;font-family:system-ui,sans-serif}
.timer{font-size:16px;color:var(--soft)}
@media (max-width:520px){.visual{font-size:96px}.opt{min-height:118px;font-size:60px}.opt.txt{font-size:42px}.word{font-size:50px}.sentence{font-size:30px}.opts{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}.tile,.slot{width:58px;height:68px;font-size:36px}.group{font-size:26px}}

// ---------- Plan de 365 días sin repetir ----------
const DAYS=365;
function dayLayout(d){return['alfa','vocab','escuchar','gram','lectura','escritura','hablar',d%2===0?'cultura':'vocab']}
function buildPlan(startStr){
  const P=buildPools();const used=new Set();
  const slots={};for(let d=0;d<DAYS;d++)dayLayout(d).forEach((s,i)=>{(slots[s]=slots[s]||[]).push([d,i])});
  const plan=Array.from({length:DAYS},()=>new Array(8));const fills=[];
  for(const skill of Object.keys(slots)){
    if(skill==='cultura')continue;
    const r=rngFrom(hashStr('orden-'+T+'-'+skill));
    const pool=P[skill].map(x=>({x,s:x.stage+r()*.35})).sort((a,b)=>a.s-b.s).map(o=>o.x);
    const Nn=slots[skill].length,L=pool.length;let prev=-1;
    slots[skill].forEach(([d,i],k)=>{const p=Math.floor(k*L/Nn);if(p!==prev&&!used.has(pool[p].key)){plan[d][i]=pool[p];used.add(pool[p].key);prev=p}else fills.push([d,i,skill])});
  }
  const start=new Date(startStr+'T12:00:00');const cpool=P.cultura;const order=['dato','siNoV','diloC','siNoF'];
  for(const [d,i] of slots.cultura){
    const m=new Date(start.getTime()+d*86400000).getMonth()+1;let cand=null;
    for(const ty of order){cand=cpool.find(x=>!used.has(x.key)&&x.type===ty&&x.c.m===m);if(cand)break}
    if(!cand)for(const ty of order){cand=cpool.find(x=>!used.has(x.key)&&x.type===ty&&x.c.m===0);if(cand)break}
    if(cand){plan[d][i]=cand;used.add(cand.key)}else fills.push([d,i,'cultura'])
  }
  fills.sort((a,b)=>a[0]-b[0]);
  const spare=[];for(const s of ['vocab','lectura','escritura','hablar','escuchar','alfa','gram'])for(const x of P[s])if(!used.has(x.key))spare.push(x);
  spare.sort((a,b)=>a.stage-b.stage);
  for(const [d,i] of fills){const x=spare.find(z=>!used.has(z.key)&&!plan[d].some(y=>y&&y.skill===z.skill&&y.type===z.type));const y=x||spare.find(z=>!used.has(z.key));plan[d][i]=y;used.add(y.key)}
  return plan;
}

function voicesFor(lang){const pref=lang==='en'?['en-us','en-gb','en']:['es-us','es-mx','es-419','es'];
  const out=[];for(const p of pref)for(const v of voices)if(langOf(v).startsWith(p)&&!out.includes(v))out.push(v);

function setCaption(parts){const c=document.getElementById('cap');if(!c)return;c.textContent=noAudio?parts.filter(p=>p[1]===T).map(p=>p[0]).join(' · '):''}

  const bar=el('div',{id:'noaudio',style:'position:fixed;top:0;left:0;right:0;z-index:50;background:#fff3c4;padding:10px 14px;font-family:system-ui,sans-serif;font-size:15px;box-shadow:0 2px 6px #0002;text-align:left'},
    el('b',null,I('🔇 No se escucha la voz. ','🔇 No sound. ')),I('1) Suba el volumen y quite el modo silencio 🔕. 2) Si usa la app de Claude, abra el enlace en Safari o Chrome. Mientras tanto, la palabra aparece escrita. ','1) Turn the volume up and switch off silent mode 🔕. 2) If you use the Claude app, open the link in Safari or Chrome. Meanwhile, the word is shown in writing. '),
    el('button',{class:'btn',style:'font-size:15px;padding:6px 12px;margin-top:6px',onclick:()=>{noAudio=false;bar.remove();say([ES('Hola.'),EN('Hello!')])}},I('🔊 Probar otra vez','🔊 Try again')));

function say(parts,cb,rate){
  const tok=++speakToken;setCaption(parts);
  if(!('speechSynthesis' in window)){showNoAudio();setCaption(parts);cb&&cb();return}
  let busy=false;try{busy=speechSynthesis.speaking||speechSynthesis.pending;speechSynthesis.cancel()}catch(e){}
  parts=parts.flatMap(([t,l])=>String(t).length>140?String(t).split(/(?<=[.!?,;])\s+/).filter(Boolean).map(x=>[x,l]):[[t,l]]);
  let i=0;
  const next=()=>{if(tok!==speakToken)return;if(i>=parts.length){cb&&cb();return}
    const [t,l]=parts[i++];const u=new SpeechSynthesisUtterance(t);keep.push(u);if(keep.length>20)keep.shift();
    u.lang=l==='en'?'en-US':'es-US';const v=voiceFor(l);if(v)try{u.voice=v}catch(e){}
    u.rate=rate||(l===T?S.rate:Math.min(1,S.rate+.1));u.pitch=1.1;u.volume=1;
    let done=false,started=false;const fin=()=>{if(done)return;done=true;setTimeout(next,150)};
    u.onstart=()=>{started=true;audioOK=true;const b=document.getElementById('noaudio');if(b){b.remove();noAudio=false;setCaption([])}};
    u.onend=fin;u.onerror=fin;
    setTimeout(()=>{if(!started&&!done&&!audioOK&&tok===speakToken){showNoAudio();setCaption(parts)}},2500);
    setTimeout(fin,Math.max(3000,t.length*150));
    try{speechSynthesis.resume()}catch(e){}
    try{speechSynthesis.speak(u)}catch(e){fin()}};
  if(busy)setTimeout(next,120);else next();
}

function tone(freqs,dur){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t0=actx.currentTime;freqs.forEach((f,k)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0+k*dur);g.gain.linearRampToValueAtTime(.18,t0+k*dur+.02);g.gain.exponentialRampToValueAtTime(.001,t0+k*dur+dur);o.connect(g);g.connect(actx.destination);o.start(t0+k*dur);o.stop(t0+k*dur+dur+.05)})}catch(e){}}
